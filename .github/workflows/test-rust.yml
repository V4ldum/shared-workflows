name: test rust project
on:
    workflow_call:
        inputs:
            test:
                required: false
                type: boolean
                default: true
            format:
                required: false
                type: boolean
                default: true
            clippy:
                required: false
                type: boolean
                default: true

env:
    CARGO_TERM_COLOR: always
    SQLX_OFFLINE: true

jobs:
    format:
        if: inputs.format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: rustfmt
                  cache: false

            - name: Enforce formatting
              run: cargo fmt --all --check

    clippy:
        if: inputs.clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: clippy

            - name: Linting
              env:
                  # Reduce cache size for debug builds, which this is
                  CARGO_PROFILE_DEV_DEBUG: 0
              run: cargo clippy --locked --workspace --all-targets -- -D warnings

    test:
        if: inputs.test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions-rust-lang/setup-rust-toolchain@v1

            - uses: taiki-e/install-action@nextest

            - name: Run tests
              run: cargo nextest run --locked --workspace --all-targets --release --max-fail 5 --no-tests=pass
