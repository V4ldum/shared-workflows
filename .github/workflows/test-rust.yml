name: test rust project
on:
    workflow_call:
        inputs:
            test:
                required: false
                type: boolean
                default: true
            format:
                required: false
                type: boolean
                default: true
            clippy:
                required: false
                type: boolean
                default: true

env:
    CARGO_TERM_COLOR: always
    SQLX_OFFLINE: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              if: inputs.test

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              if: inputs.test

            - name: Install sqlx-cli
              if: inputs.test
              run: cargo install sqlx-cli --locked

            - name: Check SQLX queries
              if: inputs.test
              run: cargo sqlx prepare --workspace --check -- --all-targets

            - name: Run tests
              if: inputs.test
              run: cargo test

