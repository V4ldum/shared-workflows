name: test static-shock project
on:
    workflow_call:
        inputs:
            enabled:
                required: false
                type: boolean
                default: true

jobs:
    analyze:
        runs-on: ubuntu-latest
        if: inputs.enabled
        steps:
            - uses: actions/checkout@v7

            - uses: dart-lang/setup-dart@v1

            - name: Config Dart
              run: dart --disable-analytics

            - name: Install dependencies
              run: dart pub get

            - name: Analyze project source
              run: dart analyze
