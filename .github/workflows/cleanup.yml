name: cleanup old images
on:
    workflow_call:
        inputs:
            project:
                required: true
                type: string

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
          - uses: dataaxiom/ghcr-cleanup-action@v1
            with:
                package: ${{ inputs.project }}
                keep-n-tagged: 3
                delete-ghost-images: true
                delete-partial-images: true
                delete-orphaned-images: true
