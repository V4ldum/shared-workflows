name: deploy to vps
on:
    workflow_call:
        inputs:
            project:
                required: true
                type: string
            manifest:
                required: false
                type: string
                default: "kubernetes.yml"

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            KUBE_SERVER: https://kube.valdum.dev
            KUBECTL_APPLYSET: true
            PROJECT: ${{ inputs.project }}
            MANIFEST: ${{ inputs.manifest }}
        steps:
            - uses: actions/checkout@v7

            - name: Get OIDC token
              run: |
                  TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vps" | jq -r .value)
                  echo "::add-mask::$TOKEN"
                  echo "KUBE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

            - name: Apply manifest
              run: |
                      kubectl --server="$KUBE_SERVER" \
                              --token="$KUBE_TOKEN" \
                              apply \
                              --server-side \
                              --prune \
                              --applyset="configmaps/$PROJECT-apply-set" \
                              -n default \
                              -f "$MANIFEST"

            - name: Rollout
              run: |
                      kubectl --server="$KUBE_SERVER" \
                      --token="$KUBE_TOKEN" \
                      rollout restart "deployment/$PROJECT" \
                      -n default

            - name: Wait for rollout
              run: |
                      kubectl --server="$KUBE_SERVER" \
                              --token="$KUBE_TOKEN" \
                              rollout status "deployment/$PROJECT" \
                              --timeout=180s \
                              -n default
