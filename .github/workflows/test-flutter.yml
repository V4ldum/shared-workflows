name: test flutter project
on:
    workflow_call:
        inputs:
            format:
                required: false
                type: boolean
                default: true
            analyze:
                required: false
                type: boolean
                default: true
            test:
                required: false
                type: boolean
                default: true
        secrets:
            ENV:
                required: false

jobs:
    correctness:
        if: inputs.format || inputs.analyze || inputs.test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: subosito/flutter-action@v2
              with:
                  cache: true
                  pub-cache: true

            - name: Config Flutter
              run: flutter config --no-analytics --enable-web

            - name: Enforce formatting
              if: inputs.format
              run: dart format --set-exit-if-changed --output=none .

            - name: Install dependencies
              if: inputs.analyze || inputs.test
              run: flutter pub get

            - name: Create env file
              if: inputs.analyze || inputs.test
              run: |
                  if [ -n "$ENV_SECRET" ]; then
                    echo "$ENV_SECRET" > .env
                  fi
              env:
                  ENV_SECRET: ${{ secrets.ENV }}

            - name: Cache build_runner state
              if: inputs.analyze || inputs.test
              uses: actions/cache@v6
              with:
                  path: .dart_tool/build
                  key: build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-${{ github.run_id }}
                  restore-keys: |
                      build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-

            - name: Rebuild generated code
              if: inputs.analyze || inputs.test
              run: dart run build_runner build -d

            - name: Analyze project source
              if: inputs.analyze
              run: flutter analyze --fatal-infos --fatal-warnings

            - name: Run tests
              if: inputs.test
              run: flutter test --color
